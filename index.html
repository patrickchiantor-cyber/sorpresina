<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una cosa per te 💗</title>
  <style>
    :root { --sfondo:#fff0f4; --colore:#ff5c8a; --testo:#38232b; --scheda:#fff; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
      background:var(--sfondo); color:var(--testo);
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    }
    main {
      width:min(100%,430px); text-align:center; background:var(--scheda);
      border-radius:26px; padding:34px 24px; box-shadow:0 12px 35px #8c35501c;
    }
    .cuore { font-size:48px; margin-bottom:12px; }
    h1 { font-size:26px; margin:0 0 14px; }
    p { font-size:17px; line-height:1.5; min-height:52px; }
    button {
      border:0; border-radius:999px; background:var(--colore); color:#fff;
      padding:14px 25px; font-size:16px; font-weight:700; cursor:pointer;
      margin-top:12px; box-shadow:0 5px 0 #d84370;
    }
    button:active { transform:translateY(3px); box-shadow:0 2px 0 #d84370; }
    .piccolo { font-size:12px; opacity:.65; margin-top:18px; min-height:auto; }
    #fotoFinale {
      display:none; width:100%; max-height:420px; object-fit:contain;
      border-radius:18px; margin-top:18px; box-shadow:0 7px 20px #8c355022;
    }
  </style>
</head>

    let passo = -1;
    let finito = false;
    const titolo = document.getElementById("titolo");
    const messaggio = document.getElementById("messaggio");
    const pulsante = document.getElementById("pulsante");
    const emoji = document.getElementById("emoji");
    const nota = document.getElementById("nota");
    const fotoFinale = document.getElementById("fotoFinale");

    document.documentElement.style.setProperty("--colore", PERSONALIZZA.colore);
    document.documentElement.style.setProperty("--sfondo", PERSONALIZZA.sfondo);
    document.documentElement.style.setProperty("--scheda", PERSONALIZZA.scheda);
    titolo.textContent = PERSONALIZZA.titolo;
    messaggio.textContent = "Ciao " + PERSONALIZZA.nome + ", premi qui sotto. Fidati.";
    pulsante.textContent = "Clicca qui 👀";
    nota.textContent = "Messaggio riservatissimo.";

    pulsante.addEventListener("click", () => {
      if (finito) { location.reload(); return; }
      passo++;
      if (passo < PERSONALIZZA.passaggi.length) {
        messaggio.textContent = PERSONALIZZA.passaggi[passo].testo;
        pulsante.textContent = PERSONALIZZA.passaggi[passo].bottone;
        emoji.textContent = ["🤨", "🧐", "😂", "🤡"][passo] || PERSONALIZZA.emoji;
      } else {
        titolo.textContent = "Ok, basta scherzi " + PERSONALIZZA.nome + " 💗";
        messaggio.textContent = PERSONALIZZA.finale;
        emoji.textContent = "💗";
        pulsante.textContent = "Ricomincia 🔁";
        nota.textContent = PERSONALIZZA.didascaliaFoto || PERSONALIZZA.notaFinale;
        fotoFinale.src = FOTO;
        fotoFinale.style.display = "block";
        finito = true;
      }
    });
  </script>
